spring:
  application:
    name: dota2-coach
  config:
    # Lê as chaves do .env na raiz do repositório (o spring-boot:run roda dentro de backend/api).
    import: "optional:file:../../.env[.properties],optional:file:.env[.properties]"
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:dota2coach}
    username: ${POSTGRES_USER:dota2coach}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    session:
      timeout: 24h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

dota2coach:
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  steam:
    open-id-endpoint: https://steamcommunity.com/openid/login
    api-key: ${STEAM_API_KEY:}
  opendota:
    base-url: https://api.opendota.com/api
    api-key: ${OPENDOTA_API_KEY:}
    requests-per-minute: 50
    max-attempts: 3
    initial-backoff: 1s
    connect-timeout: 5s
    read-timeout: 30s
    cache-ttl: 15m
  coach:
    providers:
      claude:
        type: anthropic
        api-key: ${ANTHROPIC_API_KEY:}
        model: claude-opus-5-5
        effort: high
        input-price-per-million: 4.0
        output-price-per-million: 20.0
        read-timeout: 10m
      gpt-oss-120b-groq:
        type: openai-compatible
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY:}
        model: openai/gpt-oss-120b
      qwen-7b-local:
        type: openai-compatible
        base-url: http://localhost:11434/v1
        model: qwen2.5:7b
        enabled: false
        api-key-required: false
        read-timeout: 15m
